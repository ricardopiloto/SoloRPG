# WFRP Solo — deploy com Docker
#
# Uso:
#   cp .env.docker.example .env         # edite secrets e URLs
#   mkdir -p /opt/apps/solorpg/data     # (ou WFRP_DATA_DIR=./data para dev local)
#   docker compose up -d --build
#
# Separação de responsabilidades:
#   /opt/apps/solorpg/app/   ← este repo (pode ser deletado/atualizado)
#   /opt/apps/solorpg/data/  ← SQLite (bind mount → /data no container)
#                               NÃO é apagado com "docker compose down"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/wfrp_solo.db
    volumes:
      - ${WFRP_DATA_DIR:-./data}:/data
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_ENABLE_CUSTOM_CHARGEN: ${NEXT_PUBLIC_ENABLE_CUSTOM_CHARGEN:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:3000}:3000"
