services:
  db:
    image: pgvector/pgvector:pg16
    # Fedora sem Docker: use Podman — podman compose up -d
    environment:
      POSTGRES_USER: wfrp
      POSTGRES_PASSWORD: wfrp
      POSTGRES_DB: wfrp_solo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
